version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bangla_news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bangla_news}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bangla_news}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bangla_news_net

  redis:
    image: redis:7-alpine
    container_name: bangla_news_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bangla_news_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bangla_news_net:
    driver: bridge
